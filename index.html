<style>
/* Layout: semaine (7 jours x midi/soir) à gauche, réserve de 20 plats à droite; empilé sur téléphone. */
:root {
  --bg: #EEF1EC;
  --surface: #FBFCFA;
  --ink: #1B2820;
  --muted: #5E6D63;
  --line: #D3DAD2;
  --accent: #2E7D4F;
  --accent-ink: #FFFFFF;
  --midi-bg: #E4EEC8;
  --midi-ink: #3D4A12;
  --soir-bg: #CDE6E0;
  --soir-ink: #14403A;
  --free-bg: #E4E8E2;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-mode="light"]) {
    --bg: #121A15; --surface: #1B261F; --ink: #E8EFE9; --muted: #94A399; --line: #2D3B32;
    --accent: #5CC389; --accent-ink: #0F1A13;
    --midi-bg: #34401A; --midi-ink: #D5E6A6;
    --soir-bg: #1B3D3A; --soir-ink: #A9DCD2;
    --free-bg: #26332B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"] {
  --bg: #121A15; --surface: #1B261F; --ink: #E8EFE9; --muted: #94A399; --line: #2D3B32;
  --accent: #5CC389; --accent-ink: #0F1A13;
  --midi-bg: #34401A; --midi-ink: #D5E6A6;
  --soir-bg: #1B3D3A; --soir-ink: #A9DCD2;
  --free-bg: #26332B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 20px 96px;
}
.wrap { max-width: 1100px; margin: 0 auto; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 22px; }
h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
#weeklabel { color: var(--ink); font-weight: 600; }
#count::before { content: "·"; margin-right: 8px; }
.navbtn {
  width: 30px; height: 30px; padding: 0; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 19px; line-height: 1; cursor: pointer;
}
.navbtn:hover { border-color: var(--accent); }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; padding: 2px 4px; text-decoration: underline; }
.navbtn:focus-visible, .linkbtn:focus-visible, .themeswitch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Interrupteur clair / sombre : soleil à gauche, lune à droite, le rond glisse sous l'icône active */
.themeswitch {
  position: relative; flex: none; width: 62px; height: 36px; padding: 0; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted);
}
.themeswitch .knob {
  position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); transition: transform 160ms ease;
}
.themeswitch[aria-checked="true"] .knob { transform: translateX(26px); }
.themeswitch .ic { position: absolute; top: 9px; pointer-events: none; }
.themeswitch .sun { left: 9px; color: var(--accent-ink); }
.themeswitch .moon { right: 9px; }
.themeswitch[aria-checked="true"] .sun { color: var(--muted); }
.themeswitch[aria-checked="true"] .moon { color: var(--accent-ink); }
@media (prefers-reduced-motion: reduce) { .themeswitch .knob { transition: none; } }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(0.96); }
.btn:focus-visible, .slot:focus-visible, .card:focus-visible, #q:focus-visible, .x:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.help { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; max-width: 70ch; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 900px) {
  /* La boîte des plats prend exactement la hauteur de la semaine; seule sa liste défile. */
  .layout { grid-template-columns: minmax(0, 1fr) 350px; align-items: stretch; }
  .pool { position: relative; padding: 0; }
  .pool-inner { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 14px; }
  .pool-list { flex: 1 1 auto; overflow-y: auto; padding-right: 2px; }
}

/* Semaine */
.week { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.colhead {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 4px 4px calc(4px + 0.08em); text-align: center; color: var(--muted);
}
.colhead.midi { color: var(--midi-ink); }
.colhead.soir { color: var(--soir-ink); }
.day { display: flex; flex-direction: column; justify-content: center; line-height: 1.1; padding-right: 2px; }
.day b { font-family: var(--font-display); font-size: 1.05rem; }
.day span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.slot {
  min-height: 62px; border-radius: 10px; padding: 6px; display: flex; align-items: stretch;
  border: 1.5px dashed var(--line); color: var(--muted); font-size: 12.5px;
  transition: background-color 120ms, border-color 120ms;
}
.slot.empty { align-items: center; justify-content: center; text-align: center; cursor: pointer; }
.slot.filled { border-style: solid; border-color: transparent; flex-direction: column; justify-content: center; }
.slot.filled .chip + .chip { border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); margin-top: 5px; padding-top: 5px; }
.add-hint { display: none; font-size: 11.5px; opacity: 0.75; padding-top: 4px; }
.picking .slot.filled.has1 .add-hint, .dragmode .slot.filled.has1 .add-hint { display: block; }
.slot.filled.midi { background: var(--midi-bg); color: var(--midi-ink); }
.slot.filled.soir { background: var(--soir-bg); color: var(--soir-ink); }
.slot.filled.free { background: var(--free-bg); color: var(--muted); }
.picking .slot.empty { border-color: var(--accent); color: var(--accent); }
.slot.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.chip {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; width: 100%;
  cursor: grab; font-weight: 600; font-size: 13.5px; line-height: 1.2;
}
.chip-name { min-width: 0; overflow-wrap: anywhere; align-self: center; }
.x {
  flex: none; width: 24px; height: 24px; border-radius: 50%; border: 0; cursor: pointer;
  background: transparent; color: inherit; font-size: 18px; line-height: 1; opacity: 0.65;
}
.x:hover { opacity: 1; background: color-mix(in srgb, currentColor 14%, transparent); }
.dragging { opacity: 0.45; }

/* Réserve de plats */
.pool, .weekbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
@media (max-width: 520px) { .weekbox { padding: 10px; } }
.pool.over { border-color: var(--accent); }
.pool h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0 0 8px; }
#q {
  width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font: inherit; margin-bottom: 10px;
}
.pool-list { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.card {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: grab;
  background: var(--bg); display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.card:hover { border-color: var(--accent); }
.card[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }
.card.special { background: var(--free-bg); }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-name { font-weight: 600; font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; }
.count {
  flex: none; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px;
  background: var(--accent); color: var(--accent-ink); font-variant-numeric: tabular-nums;
}
.card p { margin: 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.card p b { font-weight: 600; color: var(--ink); }
.none { color: var(--muted); font-size: 13.5px; padding: 8px 2px; }

/* Barre de sélection (téléphone) */
.pickbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.pickbar span { min-width: 0; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .slot { transition: none; } }
</style>
<script>
/* Version claire par défaut; le bouton "Mode sombre" bascule et mémorise le choix sur cet appareil. */
try { document.documentElement.setAttribute("data-mode", localStorage.getItem("planning-mode") === "dark" ? "dark" : "light"); }
catch (e) { document.documentElement.setAttribute("data-mode", "light"); }
</script>

  <header>
    <div>
      <h1>Planning des repas</h1>
      <p class="sub">
        <button class="navbtn" id="prev" type="button" aria-label="Semaine précédente">‹</button>
        <span id="weeklabel"></span>
        <button class="navbtn" id="next" type="button" aria-label="Semaine suivante">›</button>
        <button class="linkbtn" id="today" type="button" hidden>Cette semaine</button>
        <span id="count">0 repas sur 14</span>
      </p>
    </div>
    <div class="tools">
      <button class="btn primary" id="fill" type="button">Reprendre repas S-1</button>
      <button class="btn" id="clear" type="button">Vider la semaine</button>
      <button class="themeswitch" id="mode" type="button" role="switch" aria-checked="false" aria-label="Mode sombre" title="Clair / sombre">
        <span class="knob"></span>
        <svg class="ic sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout" id="layout">
    <section class="weekbox" aria-label="Semaine">
      <div class="week" id="week"></div>
    </section>

    <aside class="pool" id="pool" aria-label="Plats disponibles">
      <div class="pool-inner">
        <h2 id="pooltitle">Plats</h2>
        <input id="q" type="search" placeholder="Chercher un plat" autocomplete="off">
        <div class="pool-list" id="list"></div>
      </div>
    </aside>
  </div>
</div>

<div class="pickbar" id="pickbar" hidden>
  <span id="picktext"></span>
  <button class="btn" id="unpick" type="button">Annuler</button>
</div>

  var filter = "";
  var db = null;               // base partagée, si disponible
  var ref = null;              // document de la semaine affichée
  var unsub = null;
  var lastSaved = "";
  var saveTimer = null, writing = false;

  var $week = document.getElementById("week");
  var $list = document.getElementById("list");
  var $pool = document.getElementById("pool");
  var $layout = document.getElementById("layout");
  var $count = document.getElementById("count");
  var $pickbar = document.getElementById("pickbar");
  var $picktext = document.getElementById("picktext");

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

  /* ---------- rendu ---------- */
  function slotHTML(key) {
    var ids = state.slots[key] || [];
    if (!ids.length) {
      return '<div class="slot empty" data-slot="' + key + '" tabindex="0" role="button" aria-label="Créneau libre">Déposer un plat</div>';
    }
    var onlySpecial = ids.every(function (id) { return BY_ID[id].special; });
    var kind = onlySpecial ? "free" : (key.slice(-1) === "m" ? "midi" : "soir");
    var chips = ids.map(function (id, i) {
      var d = BY_ID[id];
      return '<div class="chip" draggable="true" data-dish="' + d.id + '" data-from="' + key + '" data-i="' + i + '">' +
        '<span class="chip-name">' + esc(d.name) + '</span>' +
        '<button class="x" type="button" data-clear="' + key + '" data-i="' + i + '" aria-label="Retirer ' + esc(d.name) + '">×</button>' +
        '</div>';
    }).join("");
    return '<div class="slot filled has' + ids.length + ' ' + kind + '" data-slot="' + key + '">' + chips +
      (ids.length < 2 ? '<div class="add-hint">+ 2e plat possible</div>' : "") + '</div>';
  }

  function renderWeek() {
    var h = '<div></div><div class="colhead midi">Midi</div><div class="colhead soir">Soir</div>';
    for (var i = 0; i < 7; i++) {
      var dt = addDays(weekStart, i);
      h += '<div class="day"><b>' + WD[i] + '</b><span>' + dt.getDate() + " " + SHORT[dt.getMonth()] + '</span></div>' + slotHTML(i + "-m") + slotHTML(i + "-s");
    }
    $week.innerHTML = h;
    $count.textContent = Object.keys(state.slots).length + " repas sur 14";
  }
  function renderHead() {
    document.getElementById("weeklabel").textContent = weekLabel(weekStart);
    document.getElementById("today").hidden = (iso === isoOf(defaultMonday()));
  }

  function usage() {
    var c = {};
    Object.keys(state.slots).forEach(function (k) {
      state.slots[k].forEach(function (id) { c[id] = (c[id] || 0) + 1; });
    });
    return c;
  }

  function cardHTML(d, c) {
    var badge = c[d.id] ? '<span class="count" title="Déjà planifié">×' + c[d.id] + '</span>' : "";
    var body = d.special
      ? '<p>' + esc(d.note) + '</p>'
      : '<p><b>Légumes :</b> ' + esc(d.veg) + '</p>';
    return '<div class="card' + (d.special ? " special" : "") + '" draggable="true" tabindex="0" role="button" data-dish="' + d.id +
      '" aria-pressed="' + (selected === d.id ? "true" : "false") + '">' +
      '<div class="card-top"><span class="card-name">' + esc(d.name) + '</span>' + badge + '</div>' + body + '</div>';
  }

  function renderPool() {
    var c = usage(), q = norm(filter.trim());
    var items = SORTED.concat(SPECIALS).filter(function (d) {
      if (!q) return true;
      return norm(d.name + " " + (d.veg || "") + " " + (d.note || "")).indexOf(q) !== -1;
    });
    $list.innerHTML = items.length
      ? items.map(function (d) { return cardHTML(d, c); }).join("")
      : '<div class="none">Aucun plat ne correspond à « ' + esc(filter) + ' ».</div>';
  }

  function renderPick() {
    var on = !!selected;
    $layout.classList.toggle("picking", on);
    $pickbar.hidden = !on;
    if (on) $picktext.textContent = "Choisis un créneau pour : " + BY_ID[selected].name;
  }

  function render() { renderHead(); renderWeek(); renderPool(); renderPick(); }

  /* ---------- modifications ---------- */
  function setSlot(key, ids) {
    if (ids && ids.length) state.slots[key] = ids; else delete state.slots[key];
  }
  // Un créneau accepte 2 plats au maximum. ti = position du plat visé s'il y en a déjà 2.
  function place(key, id, from, fromIdx, ti) {
    var tgt = (state.slots[key] || []).slice();
    if (from === key) {   // même créneau : on inverse l'ordre des 2 plats
      if (tgt.length === 2) { tgt.reverse(); setSlot(key, tgt); changed(); }
      return;
    }
    if (tgt.indexOf(id) !== -1) return;   // pas deux fois le même plat dans un créneau
    var src = from ? (state.slots[from] || []).slice() : null;
    if (src) src.splice(+fromIdx, 1);
    if (tgt.length < 2) {
      tgt.push(id);
    } else {
      var r = (ti === null || ti === undefined || isNaN(ti)) ? 1 : +ti;
      var displaced = tgt[r];
      tgt[r] = id;
      if (src) src.push(displaced);   // depuis un autre créneau : échange
    }
    setSlot(key, tgt);
    if (src) setSlot(from, src);
    changed();
  }
  function cleanSlots(obj) {
    var out = {};
    if (!obj || typeof obj !== "object") return out;
    Object.keys(obj).forEach(function (k) {
      var v = obj[k];
      if (typeof v === "string") v = [v];
      if (!Array.isArray(v)) return;
      v = v.filter(function (id, i) { return BY_ID[id] && v.indexOf(id) === i; }).slice(0, 2);
      if (v.length) out[k] = v;
    });
    return out;
  }
  function changed() { render(); persist(); }

  /* ---------- sauvegarde ---------- */
  function persist() {
    var json = JSON.stringify(state.slots);
    try { localStorage.setItem(lsKey(), json); } catch (e) {}
    if (!ref) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 500);
  }
  function flush() {
    if (!ref) return;
    if (writing) { saveTimer = setTimeout(flush, 300); return; }
    var json = JSON.stringify(state.slots);
    if (json === lastSaved) return;
    writing = true;
    lastSaved = json;
    ref.set({ slots: state.slots }).catch(function () {}).then(function () { writing = false; });
  }

  /* ---------- événements ---------- */
  $week.addEventListener("click", function (e) {
    var clr = e.target.closest("[data-clear]");
    if (clr) {
      var ck = clr.getAttribute("data-clear");
      var rest = (state.slots[ck] || []).slice();
      rest.splice(+clr.getAttribute("data-i"), 1);
      setSlot(ck, rest); changed(); return;
    }
    var slot = e.target.closest(".slot");
    if (slot && selected) {
      var chip = e.target.closest(".chip");
      place(slot.getAttribute("data-slot"), selected, null, null, chip ? +chip.getAttribute("data-i") : null);
      selected = null; renderPool(); renderPick();
    }
  });
  $week.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("slot") && selected) {
      e.preventDefault(); e.target.click();
    }
  });

  $list.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (!card) return;
    var id = card.getAttribute("data-dish");
    selected = (selected === id) ? null : id;
    renderPool(); renderPick();
  });
  $list.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) {
      e.preventDefault(); e.target.click();
    }
  });
  document.getElementById("unpick").addEventListener("click", function () {
    selected = null; renderPool(); renderPick();
  });
  document.getElementById("q").addEventListener("input", function (e) {
    filter = e.target.value; renderPool();
  });

  // glisser-déposer
  var dragData = null;
  function startDrag(e) {
    var el = e.target.closest("[data-dish]");
    if (!el) return;
    dragData = { dish: el.getAttribute("data-dish"), from: el.getAttribute("data-from") || null, idx: el.getAttribute("data-i") };
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragData.dish); } catch (err) {}
    el.classList.add("dragging");
    setTimeout(function () { if (dragData) $layout.classList.add("dragmode"); }, 0);
  }
  function endDrag() {
    dragData = null;
    $layout.classList.remove("dragmode");
    document.querySelectorAll(".dragging, .over").forEach(function (n) { n.classList.remove("dragging", "over"); });
  }
  $week.addEventListener("dragstart", startDrag);
  $list.addEventListener("dragstart", startDrag);
  document.addEventListener("dragend", endDrag);

  $week.addEventListener("dragover", function (e) {
    var slot = e.target.closest(".slot");
    if (!slot || !dragData) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    $week.querySelectorAll(".over").forEach(function (n) { if (n !== slot) n.classList.remove("over"); });
    slot.classList.add("over");
  });
  $week.addEventListener("dragleave", function (e) {
    var slot = e.target.closest(".slot");
    if (slot && !slot.contains(e.relatedTarget)) slot.classList.remove("over");
  });
  $week.addEventListener("drop", function (e) {
    var slot = e.target.closest(".slot");
    if (!slot || !dragData) return;
    e.preventDefault();
    var d = dragData;
    var chipEl = e.target.closest(".chip");
    var ti = chipEl ? +chipEl.getAttribute("data-i") : null;
    endDrag();
    place(slot.getAttribute("data-slot"), d.dish, d.from, d.idx, ti);
    selected = null; renderPool(); renderPick();
  });

  // déposer un créneau sur la liste le retire de la semaine
  $pool.addEventListener("dragover", function (e) {
    if (dragData && dragData.from) { e.preventDefault(); $pool.classList.add("over"); }
  });
  $pool.addEventListener("dragleave", function (e) {
    if (!$pool.contains(e.relatedTarget)) $pool.classList.remove("over");
  });
  $pool.addEventListener("drop", function (e) {
    if (!dragData || !dragData.from) return;
    e.preventDefault();
    var from = dragData.from, idx = +dragData.idx;
    endDrag(); $pool.classList.remove("over");
    var left = (state.slots[from] || []).slice();
    left.splice(idx, 1);
    setSlot(from, left); changed();
  });

  // reprendre les repas de la semaine précédente (S-1) dans les créneaux encore vides
  var fillBtn = document.getElementById("fill"), fillTimer = null;
  function flashFill(msg) {
    fillBtn.textContent = msg;
    clearTimeout(fillTimer);
    fillTimer = setTimeout(function () { fillBtn.textContent = "Reprendre repas S-1"; }, 2500);
  }
  fillBtn.addEventListener("click", async function () {
    var mine = iso, prevIso = isoOf(addDays(weekStart, -7)), prev = null;
    if (db) {
      try {
        var snap = await db.doc("planner/w-" + prevIso).get();
        if (snap.exists) prev = cleanSlots((snap.data() || {}).slots);
      } catch (e) {}
    }
    if (!prev) {
      try {
        var raw = localStorage.getItem("planning-repas-v2-" + prevIso);
        if (raw) prev = cleanSlots(JSON.parse(raw));
      } catch (e) {}
    }
    if (mine !== iso) return;   // on a changé de semaine pendant la lecture
    var keys = prev ? Object.keys(prev) : [];
    if (!keys.length) { flashFill("S-1 est vide"); return; }
    var copied = 0;
    keys.forEach(function (k) {
      if (!state.slots[k]) { state.slots[k] = prev[k].slice(); copied++; }
    });
    if (!copied) { flashFill("Créneaux déjà remplis"); return; }
    changed();
    flashFill(copied + " repas repris");
  });

  // vider : confirmation en deux temps, dans la page
  var clearBtn = document.getElementById("clear"), clearTimer = null;
  clearBtn.addEventListener("click", function () {
    if (clearBtn.getAttribute("data-armed")) {
      clearTimeout(clearTimer);
      clearBtn.removeAttribute("data-armed");
      clearBtn.textContent = "Vider la semaine";
      state.slots = {}; changed();
      return;
    }
    if (!Object.keys(state.slots).length) return;
    clearBtn.setAttribute("data-armed", "1");
    clearBtn.textContent = "Confirmer : tout vider ?";
    clearTimer = setTimeout(function () {
      clearBtn.removeAttribute("data-armed");
      clearBtn.textContent = "Vider la semaine";
    }, 3500);
  });

  /* ---------- démarrage ---------- */
  function loadLocal() {
    state.slots = {};
    try {
      var raw = localStorage.getItem(lsKey());
      if (raw === null && iso === "2026-10-05") raw = localStorage.getItem("planning-repas-v1");  // ancienne version
      if (raw) state.slots = cleanSlots(JSON.parse(raw));
    } catch (e) {}
  }

  // Un document par semaine : planner/w-AAAA-MM-JJ (date du lundi).
  function subscribe() {
    if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
    ref = null;
    if (!db) return;
    var mine = iso;
    ref = db.doc("planner/w-" + mine);
    unsub = ref.onSnapshot(function (snap) {
      if (mine !== iso || !snap.exists) return;
      var data = snap.data() || {};
      var slots = cleanSlots(data.slots);
      var json = JSON.stringify(slots);
      if (json === lastSaved) return;
      lastSaved = json;
      state.slots = slots;
      try { localStorage.setItem(lsKey(), json); } catch (e) {}
      render();
    }, function () { if (mine === iso) ref = null; });
  }

  function showWeek(start) {
    // enregistre tout de suite une modification en attente avant de quitter la semaine
    clearTimeout(saveTimer);
    if (ref && JSON.stringify(state.slots) !== lastSaved) {
      ref.set({ slots: state.slots }).catch(function () {});
    }
    weekStart = start;
    iso = isoOf(weekStart);
    lastSaved = "";
    selected = null;
    loadLocal();
    subscribe();
    render();
  }
  document.getElementById("prev").addEventListener("click", function () { showWeek(addDays(weekStart, -7)); });
  document.getElementById("next").addEventListener("click", function () { showWeek(addDays(weekStart, 7)); });
  document.getElementById("today").addEventListener("click", function () { showWeek(defaultMonday()); });

  // bascule clair / sombre (le choix est gardé sur cet appareil)
  var modeBtn = document.getElementById("mode");
  function syncModeBtn() {
    var dark = document.documentElement.getAttribute("data-mode") === "dark";
    modeBtn.setAttribute("aria-checked", dark ? "true" : "false");
    modeBtn.setAttribute("aria-label", dark ? "Passer en mode clair" : "Passer en mode sombre");
  }
  modeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-mode") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-mode", next);
    try { localStorage.setItem("planning-mode", next); } catch (e) {}
    syncModeBtn();
  });
  syncModeBtn();

  /* ---------- démarrage ---------- */
  loadLocal();
  render();

  (async function connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      db = await window.claude.use("db");
      if (db) subscribe();
    } catch (e) { db = null; ref = null; }
  })();
})();
</script>
</body>
</html>
